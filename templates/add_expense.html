<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xarajat qo'shish — XarajatTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { display: flex; align-items: center; justify-content: center; padding: 20px; }
        .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .cat-item { display: none; }
        .cat-label {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 12px 6px; background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
            cursor: pointer; transition: all 0.2s; font-size: 11px; color: #7b7b9a; text-align: center;
        }
        .cat-label .emoji { font-size: 22px; }
        .cat-item:checked + .cat-label { background: rgba(99,102,241,0.15); border-color: #6366f1; color: #a5b4fc; }
        .cat-label:hover { border-color: rgba(99,102,241,0.4); color: #a5b4fc; }
        body::before { content: ''; position: fixed; width: 500px; height: 500px; background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%); top: -100px; right: -100px; border-radius: 50%; pointer-events: none; }
    </style>
</head>
<body>
    <div style="width:100%;max-width:480px;position:relative;z-index:1;animation:fadeUp 0.5s ease;">
        <a href="/dashboard" class="back-link">← Dashboard ga qaytish</a>
        <div class="card">
            <h2 class="card-icon">➕</h2>
            <h2>Yangi xarajat</h2>
            <br>
            <form method="POST">
                <input type="hidden" name="category" id="categoryValue" value="🍎 Oziq-ovqat">
                <div class="field">
                    <label>Miqdor (so'm)</label>
                    <input type="number" name="amount" placeholder="0" min="1" required>
                </div>
                <div class="field">
                    <label>Kategoriya</label>
                    <div class="category-grid">
                        <input type="radio" name="cat" id="c1" class="cat-item" checked onchange="document.getElementById('categoryValue').value='🍎 Oziq-ovqat'">
                        <label for="c1" class="cat-label"><span class="emoji">🍎</span>Oziq-ovqat</label>
                        <input type="radio" name="cat" id="c2" class="cat-item" onchange="document.getElementById('categoryValue').value='🚗 Transport'">
                        <label for="c2" class="cat-label"><span class="emoji">🚗</span>Transport</label>
                        <input type="radio" name="cat" id="c3" class="cat-item" onchange="document.getElementById('categoryValue').value='👕 Kiyim'">
                        <label for="c3" class="cat-label"><span class="emoji">👕</span>Kiyim</label>
                        <input type="radio" name="cat" id="c4" class="cat-item" onchange="document.getElementById('categoryValue').value='💊 Sog\'liq'">
                        <label for="c4" class="cat-label"><span class="emoji">💊</span>Sog'liq</label>
                        <input type="radio" name="cat" id="c5" class="cat-item" onchange="document.getElementById('categoryValue').value='📚 Ta\'lim'">
                        <label for="c5" class="cat-label"><span class="emoji">📚</span>Ta'lim</label>
                        <input type="radio" name="cat" id="c6" class="cat-item" onchange="document.getElementById('categoryValue').value='🎮 O\'yin'">
                        <label for="c6" class="cat-label"><span class="emoji">🎮</span>O'yin</label>
                        <input type="radio" name="cat" id="c7" class="cat-item" onchange="document.getElementById('categoryValue').value='🏠 Uy-joy'">
                        <label for="c7" class="cat-label"><span class="emoji">🏠</span>Uy-joy</label>
                        <input type="radio" name="cat" id="c8" class="cat-item" onchange="document.getElementById('categoryValue').value='📦 Boshqa'">
                        <label for="c8" class="cat-label"><span class="emoji">📦</span>Boshqa</label>
                    </div>
                </div>
                <div class="field">
                    <label>Izoh (ixtiyoriy)</label>
                    <input type="text" name="description" placeholder="Masalan: Toshkent bozori">
                </div>
                <button type="submit" class="btn btn-primary">💾 Saqlash</button>
            </form>
        </div>
    </div>
</body>
</html>
