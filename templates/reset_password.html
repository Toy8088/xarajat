<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi parol — XarajatTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Sora',sans-serif; min-height:100vh; background:#0f0f1a; display:flex; align-items:center; justify-content:center; padding:20px; }
        body::before { content:''; position:fixed; width:500px; height:500px; background:radial-gradient(circle,rgba(34,197,94,0.08) 0%,transparent 70%); bottom:-100px; left:50%; transform:translateX(-50%); border-radius:50%; pointer-events:none; }
        .container { width:100%; max-width:420px; position:relative; z-index:1; animation:fadeUp 0.5s ease; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:20px; padding:36px; }

        .steps-indicator { display:flex; align-items:center; gap:8px; margin-bottom:28px; }
        .step-dot { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
        .step-dot.done { background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; }
        .step-dot.active { background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; }
        .step-line { flex:1; height:2px; }
        .step-line.done { background:linear-gradient(90deg,#22c55e,#6366f1); }

        .card-icon { font-size:44px; margin-bottom:14px; display:block; }
        .card h2 { font-size:22px; font-weight:700; color:#fff; margin-bottom:8px; }
        .card .subtitle { color:#6b6b8a; font-size:13px; line-height:1.6; margin-bottom:26px; }

        .alert { padding:11px 14px; border-radius:10px; font-size:13px; margin-bottom:18px; display:flex; align-items:center; gap:8px; }
        .alert-error { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.25); color:#fca5a5; }

        .field { margin-bottom:20px; }
        .field label { display:block; color:#7b7b9a; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
        .password-wrap { position:relative; }
        .password-wrap input { padding-right:46px; }
        .eye-btn { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#555570; font-size:18px; padding:0; transition:color 0.2s; }
        .eye-btn:hover { color:#a5b4fc; }

        input[type="password"], input[type="text"] { width:100%; padding:13px 16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09); border-radius:10px; color:#fff; font-family:'Sora',sans-serif; font-size:14px; outline:none; transition:all 0.2s; }
        input:focus { border-color:#6366f1; background:rgba(99,102,241,0.07); }
        input::placeholder { color:#404058; }

        .match-msg { font-size:12px; margin-top:6px; min-height:16px; }

        .submit-btn { width:100%; padding:14px; background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; border:none; border-radius:10px; font-family:'Sora',sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.2s; margin-top:4px; }
        .submit-btn:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(34,197,94,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="steps-indicator">
                <div class="step-dot done">✓</div>
                <div class="step-line done"></div>
                <div class="step-dot done">✓</div>
                <div class="step-line done"></div>
                <div class="step-dot active">3</div>
            </div>

            <span class="card-icon">🔑</span>
            <h2>Yangi parol o'rnating</h2>
            <p class="subtitle">Tasdiqlash muvaffaqiyatli o'tdi! Endi yangi parolingizni kiriting.</p>

            {% if request.args.get('error') %}
            <div class="alert alert-error">❌ {{ request.args.get('error') }}</div>
            {% endif %}

            <form method="POST" onsubmit="return checkMatch()">
                <div class="field">
                    <label>Yangi parol</label>
                    <div class="password-wrap">
                        <input type="password" name="new_password" id="newPass" placeholder="••••••••" required oninput="liveCheck()">
                        <button type="button" class="eye-btn" onclick="togglePass('newPass',this)">👁</button>
                    </div>
                </div>
                <div class="field">
                    <label>Parolni tasdiqlang</label>
                    <div class="password-wrap">
                        <input type="password" name="confirm_password" id="confirmPass" placeholder="••••••••" required oninput="liveCheck()">
                        <button type="button" class="eye-btn" onclick="togglePass('confirmPass',this)">👁</button>
                    </div>
                    <div class="match-msg" id="matchMsg"></div>
                </div>
                <button type="submit" class="submit-btn">✅ Parolni saqlash</button>
            </form>
        </div>
    </div>
    <script>
        function togglePass(id, btn) {
            const inp = document.getElementById(id);
            inp.type = inp.type === 'password' ? 'text' : 'password';
            btn.textContent = inp.type === 'password' ? '👁' : '🙈';
        }
        function liveCheck() {
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('confirmPass').value;
            const msg = document.getElementById('matchMsg');
            if (!p2) { msg.textContent = ''; return; }
            if (p1 === p2) { msg.textContent = '✅ Parollar mos keldi'; msg.style.color = '#86efac'; }
            else { msg.textContent = '❌ Mos kelmadi'; msg.style.color = '#fca5a5'; }
        }
        function checkMatch() {
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('confirmPass').value;
            if (p1 !== p2) { alert('Parollar mos kelmadi!'); return false; }
            return true;
        }
    </script>
</body>
</html>
