<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi parol — XarajatTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { display:flex; align-items:center; justify-content:center; padding:20px; }
        body::before { content:''; position:fixed; width:500px; height:500px; background:radial-gradient(circle,rgba(34,197,94,0.08) 0%,transparent 70%); bottom:-100px; left:50%; transform:translateX(-50%); border-radius:50%; pointer-events:none; }
    </style>
</head>
<body>
    <div style="width:100%;max-width:420px;position:relative;z-index:1;animation:fadeUp 0.5s ease;">
        <div class="card">
            <div class="steps-indicator">
                <div class="step-dot done">✓</div>
                <div class="step-line done"></div>
                <div class="step-dot done">✓</div>
                <div class="step-line done"></div>
                <div class="step-dot active">3</div>
            </div>
            <span class="card-icon">🔑</span>
            <h2>Yangi parol o'rnating</h2>
            <p class="subtitle">Tasdiqlash muvaffaqiyatli o'tdi! Yangi parolingizni kiriting.</p>
            {% if request.args.get('error') %}
            <div class="alert alert-error">❌ {{ request.args.get('error') }}</div>
            {% endif %}
            <form method="POST" onsubmit="return checkMatch()">
                <div class="field">
                    <label>Yangi parol</label>
                    <div class="password-wrap">
                        <input type="password" name="new_password" id="newPass" placeholder="••••••••" required oninput="liveCheck()">
                        <button type="button" class="eye-btn" onclick="togglePass('newPass',this)">👁</button>
                    </div>
                </div>
                <div class="field">
                    <label>Parolni tasdiqlang</label>
                    <div class="password-wrap">
                        <input type="password" name="confirm_password" id="confirmPass" placeholder="••••••••" required oninput="liveCheck()">
                        <button type="button" class="eye-btn" onclick="togglePass('confirmPass',this)">👁</button>
                    </div>
                    <div class="match-msg" id="matchMsg"></div>
                </div>
                <button type="submit" class="btn btn-green">✅ Parolni saqlash</button>
            </form>
        </div>
    </div>
    <script>
        function togglePass(id, btn) {
            const inp = document.getElementById(id);
            inp.type = inp.type === 'password' ? 'text' : 'password';
            btn.textContent = inp.type === 'password' ? '👁' : '🙈';
        }
        function liveCheck() {
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('confirmPass').value;
            const msg = document.getElementById('matchMsg');
            if (!p2) { msg.textContent = ''; return; }
            msg.textContent = p1 === p2 ? '✅ Parollar mos keldi' : '❌ Mos kelmadi';
            msg.style.color = p1 === p2 ? '#86efac' : '#fca5a5';
        }
        function checkMatch() {
            if (document.getElementById('newPass').value !== document.getElementById('confirmPass').value) {
                alert('Parollar mos kelmadi!'); return false;
            }
            return true;
        }
    </script>
</body>
</html>
