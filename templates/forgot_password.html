<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parolni tiklash — XarajatTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { display:flex; align-items:center; justify-content:center; padding:20px; }
        body::before { content:''; position:fixed; width:500px; height:500px; background:radial-gradient(circle,rgba(236,72,153,0.1) 0%,transparent 70%); top:-100px; left:50%; transform:translateX(-50%); border-radius:50%; pointer-events:none; }
    </style>
</head>
<body>
    <div style="width:100%;max-width:420px;position:relative;z-index:1;animation:fadeUp 0.5s ease;">
        <a href="/" class="back-link">← Kirishga qaytish</a>
        <div class="card">
            <div class="steps-indicator">
                <div class="step-dot active">1</div>
                <div class="step-line"></div>
                <div class="step-dot inactive">2</div>
                <div class="step-line"></div>
                <div class="step-dot inactive">3</div>
            </div>
            <span class="card-icon">🔐</span>
            <h2>Parolni tiklash</h2>
            <p class="subtitle">Foydalanuvchi nomingizni kiriting. Telegram ga 6 xonali kod yuboramiz.</p>
            {% if request.args.get('error') %}
            <div class="alert alert-error">❌ {{ request.args.get('error') }}</div>
            {% endif %}
            <div class="info-box">✈️ Kod yuborish uchun hisobingizga <strong>Telegram Chat ID</strong> bog'langan bo'lishi kerak.</div>
            <form method="POST">
                <div class="field">
                    <label>Foydalanuvchi nomi</label>
                    <input type="text" name="username" placeholder="username" required autofocus>
                </div>
                <button type="submit" class="btn btn-pink">📨 Kodni yuborish →</button>
            </form>
        </div>
    </div>
</body>
</html>
