<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parolni tiklash — XarajatTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Sora',sans-serif; min-height:100vh; background:#0f0f1a; display:flex; align-items:center; justify-content:center; padding:20px; }
        body::before { content:''; position:fixed; width:500px; height:500px; background:radial-gradient(circle,rgba(236,72,153,0.1) 0%,transparent 70%); top:-100px; left:50%; transform:translateX(-50%); border-radius:50%; pointer-events:none; }
        .container { width:100%; max-width:420px; position:relative; z-index:1; animation:fadeUp 0.5s ease; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .back-link { display:inline-flex; align-items:center; gap:6px; color:#6b6b8a; text-decoration:none; font-size:13px; margin-bottom:24px; transition:color 0.2s; }
        .back-link:hover { color:#a5b4fc; }
        .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:20px; padding:36px; }

        .steps-indicator { display:flex; align-items:center; gap:8px; margin-bottom:28px; }
        .step-dot { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
        .step-dot.active { background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; }
        .step-dot.inactive { background:rgba(255,255,255,0.06); color:#555570; }
        .step-line { flex:1; height:2px; background:rgba(255,255,255,0.06); }
        .step-line.done { background:linear-gradient(90deg,#6366f1,#8b5cf6); }

        .card-icon { font-size:44px; margin-bottom:14px; display:block; }
        .card h2 { font-size:22px; font-weight:700; color:#fff; margin-bottom:8px; }
        .card .subtitle { color:#6b6b8a; font-size:13px; line-height:1.6; margin-bottom:26px; }
        .alert { padding:11px 14px; border-radius:10px; font-size:13px; margin-bottom:18px; display:flex; align-items:center; gap:8px; }
        .alert-error { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.25); color:#fca5a5; }
        .field { margin-bottom:20px; }
        .field label { display:block; color:#7b7b9a; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
        input[type="text"] { width:100%; padding:13px 16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09); border-radius:10px; color:#fff; font-family:'Sora',sans-serif; font-size:14px; outline:none; transition:all 0.2s; }
        input:focus { border-color:#6366f1; background:rgba(99,102,241,0.07); }
        input::placeholder { color:#404058; }
        .submit-btn { width:100%; padding:14px; background:linear-gradient(135deg,#ec4899,#8b5cf6); color:#fff; border:none; border-radius:10px; font-family:'Sora',sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.2s; }
        .submit-btn:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(139,92,246,0.3); }
        .info-box { background:rgba(0,136,204,0.08); border:1px solid rgba(0,136,204,0.2); border-radius:12px; padding:14px; margin-bottom:20px; color:#60c8f5; font-size:12px; line-height:1.7; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Kirishga qaytish</a>
        <div class="card">
            <div class="steps-indicator">
                <div class="step-dot active">1</div>
                <div class="step-line"></div>
                <div class="step-dot inactive">2</div>
                <div class="step-line"></div>
                <div class="step-dot inactive">3</div>
            </div>

            <span class="card-icon">🔐</span>
            <h2>Parolni tiklash</h2>
            <p class="subtitle">Foydalanuvchi nomingizni kiriting. Telegram ga 6 xonali tasdiqlash kodi yuboramiz.</p>

            {% if request.args.get('error') %}
            <div class="alert alert-error">❌ {{ request.args.get('error') }}</div>
            {% endif %}

            <div class="info-box">
                ✈️ Kod yuborish uchun hisobingizga <strong>Telegram Chat ID</strong> bog'langan bo'lishi kerak.
            </div>

            <form method="POST">
                <div class="field">
                    <label>Foydalanuvchi nomi</label>
                    <input type="text" name="username" placeholder="username" required autofocus>
                </div>
                <button type="submit" class="submit-btn">📨 Kodni yuborish →</button>
            </form>
        </div>
    </div>
</body>
</html>
